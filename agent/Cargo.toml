[package]
name = "packet-eye-agent"
version = "0.1.0"
description = "Local capture agent for Packet Eye"
authors = ["packet-eye"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "packet-eye-agent"
path = "src/main.rs"

[dependencies]
# Async runtime + utils
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
bitflags = "2"
lru = "0.12"

# HTTP / WebSocket
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# HTTP client (resolve self public IP)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Errors / logs
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Networking / capture
pcap = "2"
etherparse = "0.16"

# Enrichment
maxminddb = "0.24"
sysinfo = "0.32"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Time
time = { version = "0.3", features = ["formatting", "macros", "serde"] }

# CLI args
clap = { version = "4", features = ["derive"] }

# Directories (for %APPDATA%/packet-eye)
directories = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
