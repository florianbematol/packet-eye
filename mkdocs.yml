site_name: Packet Eye
site_description: Real-time network monitoring with a 3D globe UI.
site_url: https://florianbematol.github.io/packet-eye/
repo_url: https://github.com/florianbematol/packet-eye
repo_name: florianbematol/packet-eye
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/florianbematol/packet-eye

nav:
  - Home: index.md
  - Getting started:
      - Overview: guide/index.md
      - Installation: guide/install.md
      - Running the app: guide/running.md
      - Capture filters: guide/filters.md
      - The 3D globe: guide/globe.md
      - Inspecting connections: guide/inspect.md
      - Export to Wireshark: guide/export.md
      - Applications: guide/apps.md
      - History: guide/history.md
      - Firewall: guide/firewall.md
      - Alerts & threat lists: guide/alerts.md
      - GeoIP databases: guide/geoip.md
      - Security: guide/security.md
  - Reference:
      - Architecture: reference/architecture.md
      - REST API: reference/api.md
      - WebSocket protocol: reference/websocket.md
      - Frontend layout: reference/frontend.md
  - Development:
      - Contributing: dev/contributing.md
      - Project layout: dev/layout.md
      - Releasing: dev/release.md
